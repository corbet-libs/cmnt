name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustc --version
      - run: cargo fmt --all --check
      - run: node --test .github/check-pins.test.mjs
      - run: cargo metadata --locked --format-version 1 > dependency-metadata.json
      - run: node .github/check-pins.mjs dependency-metadata.json
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Record dependency license inventory
        run: >-
          cargo metadata --locked --format-version 1 |
          python3 -c 'import json,sys; d=json.load(sys.stdin); json.dump([{k:p.get(k) for k in ("name","version","license","source")} for p in d["packages"]],sys.stdout,indent=2)'
          > dependency-licenses.json
      - run: cargo test --locked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: |
            Cargo.lock
            dependency-licenses.json

  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 .github/check-first-party.py
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories
