name: ci
concurrency:
  group: ci
  cancel-in-progress: false
  queue: max
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with: &id001
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Resolve one fresh dependency snapshot
      run: 'cargo update

        rustc --version > resolver.txt

        cargo --version >> resolver.txt

        date -u +%FT%TZ >> resolver.txt

        sha256sum Cargo.lock >> resolver.txt'
    - uses: actions/upload-artifact@v7
      with:
        name: resolved-lock
        path: 'Cargo.lock

          resolver.txt'
        retention-days: 7
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: &id002
        name: resolved-lock
    - run: 'python3 .github/check-first-party.py

        python3 .github/test-source-coverage.py

        node --test .github/test-auto-merge.mjs'
    - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0
      with:
        tool: cargo-deny
    - run: cargo deny --locked check advisories
    - name: Preserve formatting feedback
      if: failure()
      run: 'cargo fmt --all

        git diff --binary > formatting.patch'
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: formatting-dependency-policy
        path: formatting.patch
        retention-days: 7
    needs:
    - resolve
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: *id002
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
    - run: rustc --version
    - run: cargo fmt --all --check
    - run: node --test .github/check-pins.test.mjs
    - run: cargo metadata --locked --format-version 1 > dependency-metadata.json
    - run: node .github/check-pins.mjs dependency-metadata.json
    - run: cargo clippy --locked --all-targets -- -D warnings
    - name: Record dependency license inventory
      run: cargo metadata --locked --format-version 1 | python3 -c 'import json,sys; d=json.load(sys.stdin);
        json.dump([{k:p.get(k) for k in ("name","version","license","source")} for p in d["packages"]],sys.stdout,indent=2)'
        > dependency-licenses.json
    - run: cargo test --locked
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-lock
        path: 'Cargo.lock

          dependency-licenses.json

          '
    - name: Preserve formatting feedback
      if: failure()
      run: 'cargo fmt --all

        git diff --binary > formatting.patch'
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: formatting-check
        path: formatting.patch
        retention-days: 7
    needs:
    - resolve
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs:
    - check
    - dependency-policy
    - resolve
    steps:
    - uses: actions/checkout@v7
      with: *id001
    - uses: actions/download-artifact@v8
      with: *id002
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
        cache-on-failure: true
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - name: Measure real round trips and failure paths
      run: 'rustc --version

        cargo llvm-cov --version

        cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage --no-cfg-coverage-nightly
        --ignore-filename-regex ''(/tests/|/tests\.rs$)'' --json --output-path coverage.json'
    - name: Export source counters from the same execution
      run: cargo llvm-cov report --locked --branch --ignore-filename-regex '(/tests/|/tests\.rs$)' --lcov
        --output-path coverage.lcov
    - name: Export independent source locations from the same execution
      run: cargo llvm-cov report --locked --branch --ignore-filename-regex '(/tests/|/tests\.rs$)' --text
        --output-path coverage.txt
    - name: Require every emitted source line and branch
      run: 'python3 .github/check-coverage.py coverage.json || true

        python3 .github/check-source-coverage.py coverage.lcov coverage.json coverage.txt'
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage
        path: 'coverage.lcov

          coverage.json

          Cargo.lock

          resolver.txt

          coverage.txt'
        retention-days: 7
'on':
  push:
    branches:
    - main
    paths-ignore:
    - '**.md'
    - LICENSE
    - LICENSES/**
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
  CARGO_HTTP_USER_AGENT: dependency-ci
