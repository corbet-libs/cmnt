[package]
name = "cmnt"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Community facade of cvld: membership, gatekeeping and policy per community"
license = "FSL-1.1-ALv2"
repository = "https://github.com/corbet-libs/cmnt"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "docs/**", "README.md", "LICENSE.md"]

[dependencies]
cmbr = { git = "https://github.com/corbet-libs/cmbr", rev = "23886f199b23964306e90d333cf2bdaa05a36b68" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
cplc = { git = "https://github.com/corbet-libs/cplc", rev = "e39d1e29272b6be0c313f57b1a7654fbfb2f9b3c" }
cgts = { git = "https://github.com/corbet-libs/cgts", rev = "3480283816d18d7f72e3fafa21a78bb8b544e5ab" }
tokio = { version = "1", features = ["sync"] }
crlt = { git = "https://github.com/corbet-foss/crlt", rev = "9c076b1e4050529406df27533e12c8e0dd1fc0db" }
cpsd = { git = "https://github.com/corbet-foss/cpsd", rev = "5aa7580b26faf10fe7f18bb041b08b5c50f49278" }
crbk = { git = "https://github.com/corbet-foss/crbk", rev = "0eff64915dbeab0a725a8b1c0ad9061ae7d83976" }
csgn = { git = "https://github.com/corbet-foss/csgn", rev = "d7203f310c3c129c3f67ef4ef3e34ccf0ae8c93b", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
crgs = { git = "https://github.com/corbet-foss/crgs", rev = "baeff343ae3b675115ec8869dbb6c0ce7d6ab8bd" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
csgn = { git = "https://github.com/corbet-foss/csgn", rev = "d7203f310c3c129c3f67ef4ef3e34ccf0ae8c93b", features = ["signer"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Freeze the balance leaves reached through cgts's transitive manifests.
[patch."https://github.com/corbet-foss/cssr"]
cssr = { git = "https://github.com/corbet-foss/cssr.git", rev = "099701e90b1829baed56f547e65d4e4f210f3016" }
[patch."https://github.com/corbet-foss/cvfy"]
cvfy = { git = "https://github.com/corbet-foss/cvfy.git", rev = "f121436a43a1fe6cc3e66552c0e681024566dfeb" }
[patch."https://github.com/corbet-foss/czkp"]
czkp = { git = "https://github.com/corbet-foss/czkp.git", rev = "2fdd165f8ca4732bad20e2726503a7e927b8054d" }
