name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustc --version
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Record dependency license inventory
        run: >-
          cargo metadata --locked --format-version 1 |
          python3 -c 'import json,sys; d=json.load(sys.stdin); json.dump([{k:p.get(k) for k in ("name","version","license","source")} for p in d["packages"]],sys.stdout,indent=2)'
          > dependency-licenses.json
      - run: cargo test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: |
            Cargo.lock
            dependency-licenses.json
