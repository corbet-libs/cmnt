name: Dependabot auto-merge
true:
  workflow_run:
    workflows:
    - ci
    types:
    - completed
permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read
concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  enable:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/github-script@v8
      with:
        script: "const {owner, repo} = context.repo;\nconst run = context.payload.workflow_run;\nconst\
          \ expected = [\"resolve\", \"dependency-policy\", \"check\", \"coverage\"];\nconst workflow\
          \ = await github.rest.actions.getWorkflow({owner, repo, workflow_id: 'ci.yml'});\nif (run.workflow_id\
          \ !== workflow.data.id || run.path !== '.github/workflows/ci.yml') {\n  throw new Error('Unexpected\
          \ CI workflow');\n}\nconst jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,\
          \ {\n  owner, repo, run_id: run.id, filter: 'latest', per_page: 100\n});\nif (expected.some(name\
          \ => !jobs.some(j => j.name === name && j.conclusion === 'success')) ||\n    jobs.some(j =>\
          \ j.status !== 'completed' || j.conclusion !== 'success')) {\n  throw new Error('Substantive\
          \ CI jobs are missing or not successful');\n}\n// workflow_run can omit PR associations, including\
          \ for Dependabot.\nconst candidates = run.pull_requests?.length ? run.pull_requests :\n  await\
          \ github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {\n    owner, repo,\
          \ commit_sha: run.head_sha, per_page: 100\n  });\nif (!candidates.length) throw new Error('No\
          \ pull request metadata for the tested head');\nfor (const candidate of candidates) {\n  const\
          \ {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: candidate.number});\n\
          \  if (pr.user.login !== 'dependabot[bot]' || pr.state !== 'open' || pr.draft ||\n      pr.base.ref\
          \ !== 'main' || pr.head.repo?.full_name !== `${owner}/${repo}` ||\n      pr.head.sha !== run.head_sha)\
          \ continue;\n  // Public branch metadata needs no administrative token. GitHub\n  // enforces\
          \ the owner's strict/admin protection at the merge call.\n  const {data: branch} = await github.rest.repos.getBranch({owner,\
          \ repo, branch: 'main'});\n  const protection = branch.protection?.required_status_checks;\n\
          \  const names = new Set([\n    ...(protection?.contexts || []),\n    ...(protection?.checks\
          \ || []).map(check => check.context)\n  ]);\n  if (!branch.protected || protection?.enforcement_level\
          \ !== 'everyone' ||\n      expected.some(name => !names.has(name))) {\n    throw new Error('Main\
          \ must enforce every substantive check, including for administrators');\n  }\n  const checks\
          \ = await github.paginate(github.rest.checks.listForRef, {\n    owner, repo, ref: pr.head.sha,\
          \ filter: 'latest', per_page: 100\n  });\n  if (expected.some(n => !checks.some(c => c.name\
          \ === n && c.app?.slug === 'github-actions' && c.conclusion === 'success')) ||\n      checks.some(c\
          \ => c.status !== 'completed' || c.conclusion !== 'success')) {\n    throw new Error('Head check\
          \ runs are not all successful');\n  }\n  const status = await github.rest.repos.getCombinedStatusForRef({owner,\
          \ repo, ref: pr.head.sha});\n  if (status.data.total_count && status.data.state !== 'success')\
          \ throw new Error('Commit status is not successful');\n  const {data: current} = await github.rest.pulls.get({owner,\
          \ repo, pull_number: pr.number});\n  if (current.head.sha !== run.head_sha || current.state\
          \ !== 'open' ||\n      current.draft || current.base.ref !== 'main' ||\n      current.head.repo?.full_name\
          \ !== `${owner}/${repo}` ||\n      current.user.login !== 'dependabot[bot]') continue;\n  //\
          \ SHA is an atomic precondition; a newer PR head cannot be merged\n  // on this run's evidence.\
          \ Ordinary branch protections still apply.\n  const {data: merged} = await github.rest.pulls.merge({\n\
          \    owner, repo, pull_number: current.number,\n    sha: run.head_sha, merge_method: 'squash'\n\
          \  });\n  if (!merged.merged) throw new Error('GitHub refused the protected merge');\n}\n"
